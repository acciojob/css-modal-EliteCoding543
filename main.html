<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #f4f4f4;
    }

    /* ================= BUTTON ================= */

    #openModal{
      padding: 12px 20px;

      border: none;

      background-color: #0c831f;

      color: white;

      border-radius: 6px;

      cursor: pointer;
    }

    /* ================= MODAL ================= */

    .modal{
      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-color: rgba(0,0,0,0.5);

      justify-content: center;
      align-items: center;
    }

    /* ================= MODAL CONTENT ================= */

    .modal-content{
      width: 400px;

      background-color: white;

      border-radius: 8px;

      overflow: hidden;
    }

    /* ================= HEADER ================= */

    .modal-header{
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 15px;

      background-color: #0c831f;

      color: white;
    }

    /* ================= CLOSE BUTTON ================= */

    .close-modal{
      border: none;

      background: transparent;

      color: white;

      font-size: 24px;

      cursor: pointer;
    }

    /* ================= BODY ================= */

    .modal-body{
      padding: 20px;

      font-size: 18px;
    }

  </style>
</head>

<body>

  <!-- Button -->

  <button id="openModal">
    Open Modal
  </button>

  <!-- Modal -->

  <div class="modal" id="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2>Modal Header</h2>

        <button class="close-modal">
          &times;
        </button>

      </div>

      <div class="modal-body">

        <p>Modal Body Content</p>

      </div>

    </div>

  </div>

  <script>

    const openModal =
      document.getElementById("openModal");

    const modal =
      document.getElementById("modal");

    const closeModal =
      document.querySelector(".close-modal");

    // open
    openModal.addEventListener("click", function(){

      modal.style.display = "flex";

    });

    // close button
    closeModal.addEventListener("click", function(){

      modal.style.display = "none";

    });

    // outside click
    window.addEventListener("click", function(e){

      if(e.target === modal){

        modal.style.display = "none";
      }

    });

  </script>

</body>
</html>
